name: Kontrola jakosci

# Uruchamia sie przy kazdej zmianie. Celowo NIE wdraza niczego - wdrozeniem
# zajmuje sie osobny przeplyw (deploy.yml), zeby blad w testach nie mogl
# przypadkiem trafic na produkcje.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Nowy commit anuluje poprzedni, jeszcze niedokonczony przebieg.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sprawdzenie:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Skan sekretow przeglada cala historie, wiec potrzebuje jej w calosci.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts pomija postinstall, ktory pobieralby model (9 MB)
      # z internetu. Do typecheck, lintu i testow model nie jest potrzebny,
      # a bez tego kazdy przebieg trwalby dluzej i zalezal od cudzego serwera.
      - name: Instalacja zaleznosci
        run: npm ci --ignore-scripts

      # Pliki generowane skryptami, ktorych nie ma w repozytorium, a od ktorych
      # zaleza testy (test prywatnosci czyta public/sw.js - ten akurat jest
      # w repo, ale silnik bazy i ikony juz nie).
      - name: Przygotowanie plikow generowanych
        run: npm run sync-web-assets && npm run make-icons

      - name: Sprawdzenie typow
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Testy
        run: npm test

      # Podatnosci w zaleznosciach. Bledy o wysokiej wadze przerywaja przebieg;
      # nizsze sa tylko wypisywane, zeby drobiazg w narzedziu deweloperskim
      # nie blokowal pracy nad aplikacja.
      - name: Audyt zaleznosci (wysokie)
        run: npm audit --audit-level=high

      - name: Audyt zaleznosci (pelny raport)
        if: always()
        run: npm audit || true

      # Ostatnia linia obrony przed wyciekiem. Skanuje CALA historie, a nie
      # tylko biezacy stan - sekret usuniety jednym commitem nadal siedzi
      # w poprzednim i jest tak samo widoczny.
      #
      # Szukamy WZORCOW SAMYCH SEKRETOW, a nie slow, ktore je opisuja.
      # Pierwsza wersja tego kroku szukala napisu "service_role" i wywracala
      # sie na wlasnej dokumentacji, ktora wyjasnia, ze tego klucza nie wolno
      # commitowac. Kontrola, ktora zawsze swieci na czerwono, przestaje byc
      # kontrola - po tygodniu nikt na nia nie patrzy.
      - name: Szukanie sekretow w historii
        run: |
          set -e

          echo "1/3  Czy plik .env trafil kiedykolwiek do repozytorium?"
          if git log --all --pretty=format: --name-only | sort -u | grep -qE '(^|/)\.env$'; then
            echo "BLAD: plik .env znajduje sie w historii repozytorium."
            exit 1
          fi

          echo "2/3  Czy w historii sa klucze prywatne albo klucze platnosci?"
          if git grep -IlE -- '-----BEGIN [A-Z ]*PRIVATE KEY|sk_live_[0-9A-Za-z]{10,}' $(git rev-list --all) 2>/dev/null | head -1 | grep -q .; then
            echo "BLAD: w historii znaleziono klucz prywatny lub klucz platnosci."
            exit 1
          fi

          # Klucze Supabase to tokeny JWT zaczynajace sie od "eyJ". Klucz anon
          # jest jawny z zalozenia, ale i tak nie ma go po co wpisywac w kod -
          # nalezy do konfiguracji. Dokumentacje i przeplywy pomijamy, bo tam
          # takie napisy bywaja przykladem.
          echo "3/3  Czy w KODZIE (nie w dokumentacji) jest token JWT?"
          if git grep -IlE -- 'eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{20,}' $(git rev-list --all) -- '*.ts' '*.tsx' '*.js' '*.mjs' 2>/dev/null | grep -v 'package-lock.json' | head -1 | grep -q .; then
            echo "BLAD: w kodzie znaleziono cos, co wyglada na token JWT."
            exit 1
          fi

          echo "Czysto."
